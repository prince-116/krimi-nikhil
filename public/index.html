    <!-- krimi-nikhil: the site is just this invitation.
         The home page (/) boots the bundled app against its internal
         /invite/demo route, then restores the visible URL to "/" once mounted.
         In-app navigation to any other route bounces back home. Static files
         are unaffected. See README. -->
    <script>
      (function () {
        var ROUTE = "/invite/demo?template=royal-prestige";
        var ps = history.pushState, rs = history.replaceState;
        var FILE_RE = /\.[a-z0-9]+$/i;

        function clean() {
          if (location.pathname !== "/" || location.search !== "") {
            rs.call(history, null, "", "/");
          }
        }
        // restore the clean home URL once the app has mounted
        document.addEventListener("DOMContentLoaded", function () { setTimeout(clean, 300); });
        window.addEventListener("load", function () { setTimeout(clean, 150); });
        setTimeout(clean, 2000);

        if (location.pathname === "/") {
          // the router needs to see its demo route...
          rs.call(history, null, "", ROUTE);
        } else if (location.pathname !== "/invite/demo" && !FILE_RE.test(location.pathname)) {
          location.replace("/");
        }

        function gate() {
          var p = location.pathname;
          if (p === "/") return;                                       // home
          if (p === "/invite/demo") { setTimeout(clean, 250); return; } // internal route -> hide it
          if (FILE_RE.test(p)) return;                                 // static file
          location.replace("/");                                       // everything else -> home
        }

        history.pushState = function () { ps.apply(this, arguments); gate(); };
        history.replaceState = function () { rs.apply(this, arguments); gate(); };
        window.addEventListener("popstate", gate);
      })();
    </script>

    <!-- static-data shim: answers the app's Supabase demo-data and translation
         calls straight from /mock-data/*.json, so the site works on any static
         host (Cloudflare etc.) with no server and no localhost wiring. Every
         other request passes through untouched. server.mjs (local dev) still
         serves the same files from the same place. -->
    <script>
      (function () {
        var rawFetch = window.fetch.bind(window);
        var demoPromise = null, dictPromise = null;
        function loadJson(path) {
          return rawFetch(path).then(function (r) { return r.json(); });
        }
        function demoData() { return demoPromise || (demoPromise = loadJson("/mock-data/demo_templates.json")); }
        function guDict() { return dictPromise || (dictPromise = loadJson("/mock-data/translations-gu.json")); }
        function reply(body) {
          return Promise.resolve(new Response(JSON.stringify(body), {
            status: 200,
            headers: { "content-type": "application/json" }
          }));
        }
        function urlOf(input) {
          if (typeof input === "string") return input;
          if (input && input.url) return input.url;
          return String(input);
        }
        function methodOf(input, init) {
          return ((init && init.method) || (input && input.method) || "GET").toUpperCase();
        }
        function bodyOf(input, init) {
          if (init && typeof init.body === "string") return Promise.resolve(init.body);
          if (input && typeof input.clone === "function") return input.clone().text();
          return Promise.resolve("");
        }
        window.fetch = function (input, init) {
          var url = urlOf(input);
          var method = methodOf(input, init);
          if (method === "POST" && url.indexOf("/rest/v1/rpc/get_template_demo_data") !== -1) {
            return bodyOf(input, init).then(function (raw) {
              var args = {}; try { args = JSON.parse(raw || "{}"); } catch (e) {}
              return demoData().then(function (all) {
                var row = all[args.p_template_id || args.p_template_slug || ""];
                return reply(row ? [row] : []);
              });
            });
          }
          if (method === "POST" && url.indexOf("/functions/v1/translate-content") !== -1) {
            return bodyOf(input, init).then(function (raw) {
              var args = {}; try { args = JSON.parse(raw || "{}"); } catch (e) {}
              var dict = args.targetLanguage === "gu" ? guDict() : Promise.resolve({});
              return dict.then(function (d) {
                var out = {}, texts = args.texts || {};
                Object.keys(texts).forEach(function (k) {
                  var v = texts[k];
                  out[k] = (typeof v === "string" && d[v]) ? d[v] : v;
                });
                return reply({ translations: out });
              });
            });
          }
          if (method === "GET" && url.indexOf("/rest/v1/") !== -1) return reply([]);
          return rawFetch(input, init);
        };
      })();
    </script>
